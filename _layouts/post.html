---
layout: default
---
<article class="post" itemscope itemtype="https://schema.org/BlogPosting">
  <header class="post-header">
    <h1 itemprop="headline">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%Y-%m-%d" }}</time>
      {% if page.tags.size > 0 %}
        <span class="post-tags"> · {% for t in page.tags %}<span class="tag">{{ t }}</span>{% unless forloop.last %} · {% endunless %}{% endfor %}</span>
      {% endif %}
    </p>
  </header>
  <div class="post-body" itemprop="articleBody">
    {{ content }}
  </div>
  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">← Back to blog</a></p>
</article>
