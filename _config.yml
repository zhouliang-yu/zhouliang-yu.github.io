# Jekyll (GitHub Pages). Homepage index.html stays static; blog uses Liquid layouts.
title: Zhouliang Yu
description: Academic homepage & blog
url: https://zhouliang-yu.github.io
baseurl: ""

markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - ".github"

include:
  - assets
  - images
